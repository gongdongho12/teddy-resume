  - id: 2026-09-voltup-order-extraction
    period: 2026-08-31..2026-09-11
    status: candidate
    delivery: in_progress
    area: architecture
    headline: 충전 주문 처리 서비스(voltup-order) 분리 — 핵심 경로를 외부 연동 지연에서 격리
    impact: 외부 연동(차량 조회 등) 지연이 충전 시작·종료 경로로 번지는 구조를 끊기 위해 주문 경로를 독립 서비스로 분리. 이번 구간에서는 dev/stg 기동 실패를 복구하고 주문 후속 이벤트 핸들러 15개를 전용 모듈로 이관, 앱 전용 설정·검색 의존을 제거했으며, 기동 시 핸들러 등록을 검증하는 부팅 스모크 테스트를 추가해 같은 유형의 기동 실패를 배포 전에 차단. 9/10~9/11 stg 연동 검증에서 회원카드 인증 경로 간헐 지연의 원류를 노드 처닝 가설이 아니라 user-service NetworkPolicy 에 voltup-order 가 누락된 것으로 확정(드롭이라 30초 수렴, Envoy timeout 은 upstream 로그에 안 남는 특성까지 정리)하고, 인증 경로 내부 호출에 타임아웃 예산을 명시하고 웜업을 Redis·인증 하위 계층까지 확장(PR #1010).
    metrics: []
    evidence:
      prs:

  - id: 2026-10-fota-done-judgement-fix
    period: 2026-10-07..2026-10-12
    status: candidate
    delivery: deployed
    area: csms
    headline: FOTA 완료 판정 정합성 복구 — 만료로 남던 설치 완료 충전기를 Installed+목표 버전 부팅 기준으로 완료 처리
    impact: 실제 펌웨어 설치(약 20분)가 요청 만료 시간(15분)보다 길어 이벤트는 정상 도착했는데도 '만료'로 남던 원인을 로그로 실증하고, Installed 보고+목표 버전 부팅이면 완료(만료 포함)·설치 실패+목표 부팅이면 이전 버전 원복으로 판정 규칙을 재정의해 prod 핫픽스. 두 신호의 도착 순서와 무관하게 판정하도록 하고, 운영자가 만료 건을 수기 확인하던 업무를 없앰. 별건(보고 버전 문자열≠등록 버전)은 보고 원문 기록·불일치 조회 API(charger-service#153)로 분리.

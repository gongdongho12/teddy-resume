          en: "Feb 2026 — Present"
        summary:
          ko: 기후에너지환경부 공공 로밍의 카드 상태 관리·재동기화 경로를 재설계하고, 카카오T 파트너 로밍의 장시간 배치를 안전하게 종료·전환할 수 있는 운영 기반을 구성했습니다.
          en: Redesigned card-state recovery and resynchronization for Korea's public EV-roaming network, and made long-running Kakao T partner batches safe to stop and migrate without overlapping executions.
        tech:
          - Kotlin
          - Spring Boot
          - GCP Pub/Sub
          - Spring Batch
          - Redis
        highlights:
          ko:
            - 기후에너지환경부 공공 로밍 카드 상태 업데이트 로직을 결제 응답 기반에서 빌링 미수 이벤트 기반으로 재설계 — 미수 발생 건에 대해서만 선별적 상태 업데이트로 데이터 정확성 향상
            - 로밍 카드 상태 처리 경로를 단순화하고 빌링 조회를 통합해 처리 성능 개선
            - 공공 API 에러 발생 시 재처리 프로세스 구성 — 회원카드 등 중요 데이터는 우선 재처리, 충전기 상태 등 누락 허용 가능한 항목은 후순위로 분리
            - 환경부 회원카드 월 1회 전체 재동기화 스케줄러와 task seed를 추가해 외부 시스템과 장기 상태 불일치가 누적되지 않도록 보강
            - 카카오T 파트너 로밍 배치 종료 시 실행 작업보다 Redis 연결이 먼저 닫히던 순서를 교정하고, 60~75분 충전기 동기화 잡을 중복 실행 없이 상주형으로 전환할 수 있는 opt-in 스케줄러와 종료 가드를 구성
          en:
            - Changed public-roaming card-state updates from payment responses to unpaid-balance events so only relevant failures trigger state changes
            - Simplified the roaming card-state processing path and consolidated billing lookups to improve throughput
            - Built a retry process that prioritizes baseline membership-card data over lower-priority charger-status updates
            - Added monthly full resynchronization for public-roaming membership cards to prevent long-term drift from the external system
            - Corrected Kakao T batch shutdown ordering so Redis remains available until active work completes, then added an opt-in resident scheduler and shutdown guards for 60-75 minute charger-sync jobs
        results:
          ko:
            - 카드 상태 업데이트 로직 재설계로 데이터 정확성 향상
            - 변환 오버헤드 제거 및 통합 조회로 처리 성능 개선
            - 이벤트 누락이나 일시 장애 이후에도 회원카드 기준 데이터를 주기적으로 복구할 수 있는 운영 안전망 확보
            - 장시간 배치의 강제 종료·스케줄 누락 위험을 줄이고 기존 CronJob과 경합 없이 단계적으로 전환할 수 있는 기반 마련
          en:
            - Improved data accuracy by aligning card-state changes with unpaid-balance events
            - Reduced processing overhead by eliminating serialization and consolidating billing queries
            - Added an operational safety net that periodically restores member-card baseline data after missed events or transient failures
            - Reduced forced-shutdown and missed-schedule risk while allowing a staged migration without racing existing CronJobs

      - title:
          ko: 개발 생산성 자동화 및 DevOps 개선
          en: Developer Productivity and Delivery Automation
        portfolioSlug: devops-automation
        period:
          ko: 2024.10 ~ 현재
          en: Oct 2024 — Present
        summary:
          ko: 반복되는 운영 업무와 개발 비효율을 제거하기 위해 AI 코드 리뷰, 배포 자동화, MSA 개발 환경 도구, 내부 API 호출 표준을 구축했습니다.
          en: Standardized recurring engineering work through automated first-pass reviews, shared CI/CD workflows, developer-environment tooling, documentation automation, and internal API conventions.
        tech:
          - Gemini API
          - GitHub Copilot
          - Claude Code
          - Cursor
          - Antigravity
          - Firebase
          - Docker
          - Gradle
          - Workload Identity
        highlights:
          ko:
            - 여러 생성형 LLM에서 활용할 수 있도록 각 마이크로서비스의 작업 컨벤션과 공통 작업 형상을 재사용 가능한 스킬 레포지토리로 구축 (Claude Code, Cursor, Gemini 등)
            - LiteLLM 프록시와 LLM 기본 모델 단일 정본을 여러 MSA 레포에 적용하고, 1차 코드 리뷰·PR 본문 생성·보안성 검토 기안·Slack 알림을 공용 CI 워크플로로 표준화
            - Docusaurus + GitHub Actions 기반 개발 문서 자동 생성 시스템 구축 — Git Polling 방식으로 코드 변경 감지 시 문서 자동 갱신
            - billing·feapp·messaging·roaming 4개 Pub/Sub 컨슈머에 SIGTERM 시 신규 구독 중지→in-flight 처리 완료→미처리 건 재배송으로 이어지는 graceful shutdown 표준을 설계·적용하고 Kubernetes 종료 예산과 정렬
            - Firebase App Distribution 도입으로 QA/배포 프로세스 병목 제거
            - MSA 환경의 설정 파일(application-local.yaml) 자동 생성 도구 개발
            - Admin 내부 API 호출이 늘어나는 상황에서 admin-internal-* 클라이언트와 X-Internal-Caller 헤더 규약을 도입해 운영자 도구의 내부 호출 경계 표준화
            - Android/iOS 앱 배포 과정을 정리해 인증 키 관리 부담과 불필요한 실패 요인을 줄임
            - Android Jenkins 파이프라인 공통 라이브러리화, GCS Gradle 캐시, iOS 자동 배포, ProGuard/R8 정책 등
            - CSMS 로그 진입점의 페이로드 상한 설정 및 MDC 중복 제거로 Cloud Logging 일 적재량을 85% 감량(120GB → 18GB, 월 약 3TB 절감)하고 월 약 $1,400의 인프라 비용 절감 실측
            - K8s Liveness Probe 판정 범위를 프로세스 생존 상태로 한정하도록 공통 표준을 수립하여, DB 일시 순단 시 정상 동작 중인 파드까지 연쇄 재시작(Cascade)되는 장애 경로 원천 차단
          en:
            - Built a reusable repository of microservice conventions and recurring task patterns for Claude Code, Cursor, Gemini, and other coding agents
            - Rolled out a LiteLLM proxy and a single source of truth for model defaults, then standardized first-pass reviews, pull-request summaries, security-review drafts, and Slack notifications as shared CI workflows
            - Built automated Docusaurus documentation with GitHub Actions and change detection
            - "Standardized graceful shutdown across four Pub/Sub consumers: stop intake on SIGTERM, drain in-flight work, redeliver unfinished messages, and align application timing with Kubernetes termination budgets"
            - Introduced Firebase App Distribution to shorten QA and release cycles
            - Built a Gradle-based generator for local microservice configuration
            - Standardized internal operations-console API boundaries with shared clients and an X-Internal-Caller convention
            - Simplified Android and iOS delivery to reduce key-management overhead and avoidable failures
            - Consolidated Android Jenkins pipelines into shared libraries and added remote Gradle caching, iOS TestFlight automation, and shared R8 policies
            - Cut Cloud Logging volume by 85% (120GB to 18GB/day, saving ~3TB and ~$1,400/month) by enforcing body size limits and removing redundant MDC fields at log ingestion points
            - Standardized Kubernetes liveness probe boundaries to process-liveness indicators, preventing cascading pod restarts across microservices during transient database hiccups
        results:
          ko:
            - AI 코드 리뷰 자동화로 리뷰 리소스 절감
            - 정상 노드 드레인·롤링 배포 중 신규 메시지 수신과 처리 중 작업 유실 창을 제거하고 4개 서비스에 재사용 가능한 종료 규약 확립
            - Firebase 도입으로 QA 배포 사이클 단축 및 QA 자체 검증 편의성 향상
            - 문서 자동 생성 시스템 구축으로 관리 리소스 절감
            - 모바일 배포의 인증 키 관리 부담과 불필요한 실패 요인을 줄여 릴리즈 안정성 개선
          en:
            - Reduced review overhead via automated first-pass AI review
            - Removed the intake/in-flight loss window during normal node drains and rolling deployments, establishing a reusable shutdown contract across four services
            - Shortened QA and deployment cycles while enabling self-service distribution through Firebase
            - Reduced manual documentation maintenance through automated generation
            - Improved release stability by reducing mobile delivery key-management burden and avoidable failure points


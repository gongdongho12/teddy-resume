  - id: 2026-10-csms-rollout-reconnect-storm-mitigation
    period: 2026-09-30..2026-10-06
    status: reflected
    delivery: deployed
    area: csms
    headline: CSMS 롤아웃 시 충전기 1만 대 동시 재접속 DB 폭주 차단 — 헬스체크 창 파드 공유 + 롤아웃 페이싱
    impact: prod 롤아웃 직후 새 파드의 파드 로컬 헬스체크 창이 비어 재접속 충전기마다 UPDATE+COMMIT 이 몰리고 공용 Cloud SQL·커넥션 풀이 포화되던 원인을 지표로 특정하고, 헬스체크 스로틀 창을 Redis SET NX 기반 파드 공유 창(fail-open)으로 바꾸고 배포 매니페스트에 maxSurge 1·minReadySeconds 90 페이싱을 적용해 재접속이 분산되도록 했다. 결과 카운터 지표로 다음 롤아웃에서 효과를 검증할 수 있게 함.
    metrics:
      - 9/30 롤아웃 실측 — Cloud SQL QPS 3.3k→19.3k/s(5.8배), csms·charger-service 커넥션 풀 128/128 포화, charger p99 50ms→3.9s (5xx 0)
    evidence:
      prs:
        - https://github.com/lgvoltup/csms/pull/304
        - https://github.com/lgvoltup/argocd-gke-service/pull/104
      commits:
        - 7425c699
        - 46189031
        - 57542615b
    resume_targets:
      - profile.yaml#charger-gateway-scale
      - portfolio-content.ts#charger-gateway-scale
    reflected_at: 2026-11-01
    skip_reason:
  - id: 2026-10-roaming-govern-user-card-partner-cpo-recovery
    period: 2026-10-02..2026-10-15
    status: candidate
    delivery: deployed
    area: roaming
    headline: 환경부 회원카드 월 보간을 제휴 CPO 전체로 확대 — CPO 단위 진행 기록으로 중단 지점부터 재개
    impact: 자사 카드만 대상이던 월 단위 회원카드 상태 보간을 제휴 CPO 전체로 넓히고, CPO 단위 진행 기록 테이블을 두어 실패·중단 시 처리 못한 CPO 의 1페이지부터 이어받도록 설계. 8/27 증분 누락 196건류 사고가 재발해도 운영 수기 보정 없이 다음 보간에서 자동 흡수된다. 후속으로 실패 CPO 같은 실행 안 5분 간격 재시도(#305)와 환경부 엑셀 기반 보간·자사 카드 우리 판정 전송 API(#307, feapp·admin-fe 연동)를 release/261012(1.1.11)로 묶어 10/15 prod 배포·roaming-api 발행 완료.

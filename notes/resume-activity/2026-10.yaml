  - id: 2026-10-csms-reconnect-drain-pacing
    period: 2026-10-07..2026-10-13
    status: reflected
    delivery: deployed
    area: csms
    headline: CSMS 롤아웃 시 충전기 일괄 차단 방지 — 10초 페이싱 드레인 + 사이드카 종료 정렬 + 파드당 세션 상한 가드
    impact: 서버 교체 시 수천 대 충전기 연결이 동시에 끊겨 재접속 폭풍과 DB 부하가 발생하던 문제를 개선. 종료 시그널 수신 후 10초에 걸쳐 점진적으로 소켓을 끊고 신규 연결 수신을 조기 차단하며, Istio 사이드카 드레인(75초) 및 Grace Period(80초)를 앱 타임아웃과 일치시켜 배포 중 패킷 유실을 차단. 10/13 배포에서 신규 에러 0건, DB 커넥션 대기 0건 검증. 파드당 세션 상한 가드(10/15 리뷰 반영으로 7,000 확정, prod 7파드 49k 수용·16% 여유)로 롤아웃 중 구 파드 과밀과 Tomcat max-connections 포화(503)를 방지.
    metrics:
      - 10/13 운영 배포 실측 — 신규 오류 0건, DB 커넥션 풀 대기 0건
    evidence:

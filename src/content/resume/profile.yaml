      - title:
          ko: Voltbot — 사내 업무 에이전트 플랫폼, 개별 에이전트 자동 라우팅 및 로그 진단 자동화
          en: Voltbot - Agent Routing and AI-Assisted Incident Diagnosis
        portfolioSlug: voltbot-agent-platform
        period:
          ko: "2026.05 ~ 현재"
          en: "May 2026 — Present"
        summary:
          ko: |
            사내 업무 에이전트 플랫폼 Voltbot을 구축하고, 사용자 의도·권한·에이전트 상태에 따라 전문 에이전트를 자동 연결하는 Voltbot Crew와 로그·BigQuery·코드 근거를 결합한 장애 진단 흐름을 개발했습니다. 평가 하네스로 답변 품질을 유지하면서 정합성과 비용 개선을 검증했습니다.
          en: |
            Built Voltbot, an internal agent platform that routes employees to specialized agents based on intent, permissions, and agent availability. Developed an evidence-driven incident-diagnosis workflow that combines Cloud Logging, BigQuery, internal guidance, and code search across broken trace boundaries, then verified groundedness and cost improvements with an evaluation harness.
        tech:
          - Kotlin
          - Spring Boot
          - React
          - TypeScript
          - WebSocket
          - GCP Cloud Logging
          - Gemini Native Function Calling
          - Gemini API (3.6 Flash)
          - GitHub API
        highlights:
          ko:
            - 사용자의 자연어 요청을 의도·권한·에이전트 상태 기준으로 분류해 로그 분석, BigQuery 조회, 법률 지원, 코드 정책 등 필요한 전문 에이전트로 연결하는 AgentRouter 구현
            - 공통 Agent/Tool 계약 위에 AgentRunner, ToolHandler, WebSocket 스트리밍을 연결해 Tool 실행 내역, 권한, 쿼터, 중단 요청, 최종 답변이 같은 대화 흐름에 남도록 구성
            - LogDiagnosisAgent에 고객/운영 모드와 반복 조회 도구를 구성하고, traceId·user_id·order_number·시간대/제보 시그니처를 오가는 pivot 및 가설→흔적→조회→판정 루프로 첫 결론 고착과 미검증 단정을 방지
            - 정규식 기반 도구 호출을 Gemini 네이티브 function calling과 병렬 실행으로 전환하고, 구조화된 인자·실패 결과·로그/데이터/코드 근거를 공통 컨텍스트에 남겨 다음 에이전트가 이어받도록 구성
          en:
            - Implemented AgentRouter to classify requests by intent, permission, and agent availability before routing them to specialists for log diagnosis, BigQuery analysis, legal support, or code policy
            - Connected AgentRunner, ToolHandler, and WebSocket streaming through a shared Agent/Tool contract so tool history, permissions, quotas, interruptions, and final answers remain visible in one conversation
            - Added customer-support and operations modes to LogDiagnosisAgent, with iterative pivots across trace IDs, user IDs, order numbers, time windows, and report signatures; enforced a hypothesis-trace-query-verdict loop to reduce premature conclusions
            - Replaced regex-based tool calls with Gemini native function calling and parallel execution, persisting structured inputs, failures, and shared log, data, and code evidence for downstream agents
        results:
          ko:
            - 운영/CS가 개발자에게 로그 확인을 요청하기 전 결제 실패·서비스 오류·장애 패턴을 1차 진단하도록 Cloud Logging, 사내 가이드, GitHub 코드 검색을 재사용 가능한 Tool 흐름으로 표준화
            - 9개 평가 케이스를 3회씩 비교한 하네스에서 기존 루프와 답변 품질은 통계적으로 동등하게 유지하면서 정합성 지표 평균 87.7%→100%, 토큰·비용 46% 절감, 실행 시간 10% 단축
          en:
            - Standardized Cloud Logging, internal documentation, and GitHub code search as reusable tools for first-pass diagnosis before engineering escalation
            - In a 9-case × 3-run evaluation harness, preserved statistically equivalent answer quality while improving average groundedness from 87.7% to 100%, cutting tokens/cost by 46%, and reducing runtime by 10%


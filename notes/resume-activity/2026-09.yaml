  - id: 2026-09-csms-logging-cost-reduction
    period: 2026-09-07..2026-09-15
    status: candidate
    delivery: merged
    area: csms
    headline: CSMS Cloud Logging 적재량 절감 — 로거 바디 상한·MDC 중복 제거로 일 약 120GB → 18GB(−85%) 감량, prod 실측 확인
    impact: prod 실측(조각 29GB·WEB SERVER 11GB·WEB CLIENT 60GB)을 근거로 로그 진입점에 바디/라인 상한과 MDC 중복 제거를 적용하고, 실측 모사 픽스처로 자동 감량을 검증하는 시나리오 테스트를 붙였다. 인프라 비용을 코드 레벨에서 줄인 사례이며, 충전기 자격증명이 로그에 남던 경로도 함께 제거. 9/15 release/260914 로 prod 배포 완료. 로그 필드 제거가 로그 기반 지표 9개를 깨뜨리는 점을 사전에 찾아 구조화 재작성 킷을 준비했고, 적재량 감소 추이를 볼 Grafana 보드를 릴리즈노트에 연결.
    metrics:
      - prod 배포 전후 같은 20시간대 비교 104.5GB → 15.7GB (−85%), 일 환산 약 120GB → 약 18GB (Cloud Monitoring byte_count, 2026-09-16 실측)
      - 로그 건수 피크 249만 건/h → 75만 건/h (−70%), 건당 평균 4.2KB → 2.0KB
      - 월 약 3TB 적재 감소, 적재 단가 기준 약 $1,400/월 절감 추정
    evidence:
      prs:
        - https://github.com/lgvoltup/csms/pull/209
        - https://github.com/lgvoltup/csms/pull/215
        - https://github.com/lgvoltup/csms/pull/238
      commits:
        - 8e0d98fe
        - 92acf64d
    resume_targets: []
    reflected_at:
    skip_reason:

  - id: 2026-09-charging-observability-contract
    period: 2026-09-04..2026-09-17
    status: candidate
    delivery: in_progress
    area: observability
    headline: 충전 1건 종단 추적 체계 설계·1단계 구현 — Pub/Sub 구간 traceId 전파 표준과 피벗 키 관측 계약
    impact: CSMS→feapp→charger-service→로밍으로 이어지는 단가 조회 연쇄에서 Pub/Sub 3홉이 traceId를 잃던 문제를 W3C traceparent 속성 전파로 잇고, 서비스 간 추적 식별자·피벗 키·스팬 이름 표준을 관측 계약 문서와 추적 런북으로 정본화. 5개 서비스에 걸친 관측 표준화 작업으로 장애 원인 파악 경로를 사후 로그 검색에서 상관키 추적으로 전환. 9/15에는 Pub/Sub 소비자가 공용 스레드에 trace_id·pubsub_message_id 를 남겨 다른 메시지 로그와 오조인되던 MDC 수명 결함을 feapp 소비자 15곳에서 정리하고, 재발을 막는 소스 가드 테스트와 행위 테스트를 추가. 피벗 키(user_id 등)를 raw MDC.put 대신 baggage API로 올리는 표준을 csms·roaming·common(코루틴 MDCContext)에 걸쳐 적용. 9/16 에는 stg 실측으로 traceparent 는 이어지지만 baggage 헤더가 0건이라 피벗 키가 첫 홉에서 전멸한다는 것을 확인하고, charger-service 전환(#137)과 csms Feign 발신 baggage 직렬화(#261)까지 메워 서비스 간 피벗 키 전파율 0% → 관통 확인. 원인 중 하나였던 @Value 의 yaml 시퀀스 미바인딩(빈 목록 무음 주입)은 설정 프로퍼티 주입으로 고치고 실제 yaml 을 바인딩하는 회귀 테스트로 고정. 결제 구간이 charging_id 를 몰라 충전↔결제가 2단 조인이던 구조는 결제 요청 페이로드에 chargingId 선택 필드를 더해 common·billing·feapp 3개 저장소에 걸쳐 잇고, 로그 기반 충전 추적 대시보드로 조회 경로를 제공. 9/17 에는 baggage 전환을 csms·charger-service·roaming·partner-roaming·feapp 5개 서비스에서 일괄 머지하고 피벗 키 계약 자체를 공통 모듈 설정으로 끌어올려 서비스별 중복 정의를 없앴으며, 남아 있던 광역 MDC.clear() 를 자기 키만 지우는 방식으로 고치고 소스 전수 가드 테스트로 재발을 막았다. 배포는 추석 일정에 맞춰 관측 계약 전체를 9/22 릴리스 라인으로, Pub/Sub 소비자 trace_id 구간은 9/29 라인으로 분리해 롤백 단위를 좁혔다.
    metrics: []
    evidence:
      prs:

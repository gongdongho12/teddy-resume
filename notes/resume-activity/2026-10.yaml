  - id: 2026-10-csms-gw-websocket-gateway
    period: 2026-10-07..2026-10-27
    status: reflected
    delivery: deployed_stg
    area: csms
    headline: 충전기 웹소켓 게이트웨이(Go, csms-gw) 신규 구축 — A 패스스루/B Pub/Sub 이중 경로, OCPP 1.6·2.1, 다중 인스턴스, 에뮬레이터 MCP·1만 대 부하 시험, dev 가동
    impact: 모놀리식 CSMS(Spring)에서 충전기 접속 계층을 분리하는 Go 게이트웨이를 신규 저장소로 설계·구현. 웹소켓 패스스루(A)와 Pub/Sub 브리지(B) 두 경로, OCPP 1.6·2.1 서브프로토콜 협상, 브로커를 URL 스킴 드라이버(Pub/Sub·Redis Streams·memory)로 교체 가능하게 구성. OCPP 충전기 에뮬레이터를 MCP 서버(22 도구)·팀 배포 바이너리로 만들어 실물 충전기 없이 로컬 E2E(에뮬레이터→게이트웨이→csms→charger-service·feapp)를 검증 가능하게 했고, 충전기 100·1,000·10,000대 로컬 부하 시험 보고서를 작성. 해설 문서 9단원(dev_docs#76). 10/19~20 다중 인스턴스(Redis 세션 디렉터리·인스턴스 간 제어 채널·생존 키)와 B 경로 csms 브리지(verify API·inbound 구독·outbound 발행)를 csms·csms-gw 양쪽에 구현해 dev 3대로 가동, 충전기 기존 접속 주소(/ocpp)를 게이트웨이로 전환하는 호환 라우팅 확인. 10/22 csms 장애·배포 중에도 충전기 연결을 유지하도록 csms 웹소켓을 못 쓰면 핵심 메시지(부팅·인증·충전 시작·종료·설정 회신)를 Pub/Sub 로 넘기고, 전달 못 한 csms 명령은 충전기별 대기열에 두었다가 재접속 직후 전달, csms 처리 실패는 재전달·데드레터로 보내며 회신 전 웹소켓 복귀를 막아 순서를 보호. 파드 간 통신은 파드별 채널 대신 공용 제어 채널 하나로 줄이고, 세션이 12분·무수신 6분에 끊기던 결함 수정, csms 직결·게이트웨이 경유 웹소켓 세션을 실측 지표로 분리. 10/26 레이어별 성능 개선(Heartbeat 게이트웨이 직답·상태 알림/미터값 즉시 응답·csms inbound 핵심/대량 구독 분리, 요청→회신 왕복 지표)과 파드 수용량 실측, cgroup 한도에서 Go 메모리 한도·세션 상한·핸드셰이크 상한을 자동 도출하고 폭주 시 즉시 503+Retry-After 로 거절하도록 개선, 수용량·한도 튜닝 가이드 작성. 운영 투입 3단계(A 앞세우기 → B 일부 → 전면 B)·단계별 메시지 유실 시나리오·A/B 실증 설계·DB 장애 시 충전 지속(Step 4 후보)을 문서화하고 테크팀 공유 자료 작성. 10/27 stg 첫 배포 — 파드 자원을 csms 방식(CPU limit 3·메모리 2Gi, 자동 한도 약 3만 세션)으로 맞추고 csms inbound 구독 처리 스레드를 설정화(기본 20개로는 부팅 초당 70건 남짓만 수용), Google 로그인 운영 콘솔(dev) 공개, Heartbeat 를 csms 로 보내 충전 로그에 남기도록 기본값 전환, 게이트웨이 파드가 Ready 일 때만 /ocpp 를 게이트웨이로 보내고 없으면 csms 로 자동 전환하는 Istio failover 진입점 설계.
    metrics:

  - id: 2026-10-spring-boot4-migration
    period: 2026-10-08..2026-10-28
    status: candidate
    delivery: in_progress
    area: platform
    headline: Spring Boot 4 전환(CVE-2026-47884 대응) — 18개 서비스 대상 선대응·전환 오케스트레이션 (csms Boot 4 prod 반영·공통 라이브러리 2.0.0 발행)
    impact: Boot 4.0.8 이상에서만 닫히는 spring-webmvc 치명 취약점(9.8) 대응을 위해 레포별 프로브(Boot 4 컴파일 깨짐 분류)→3.5 라인 선대응 PR(JDK 21·Kotlin 2.3·Gradle 8.14·QueryDSL OpenFeign·Kotest 6)→Boot 4 전환 순서로 표준화하고 /boot4 스킬로 자동화. csms·roaming·partner-roaming·user-service 선대응 완료(dev·stg 반영), 공통 라이브러리 Boot 4 포팅(2.0.0-SNAPSHOT)과 소비 서비스 전환 진행 중. 공통 라이브러리가 소비 레포 전환의 게이트임을 프로브로 확인해 일정 제약을 사전에 드러냄. 10/22 Jackson 3 전환을 공통 라이브러리(Jackson 2 양방향 호환)에 머지하고, csms 는 Jackson 3 100% 전환을 OCPP·HTTP·Pub/Sub JSON 골든 6,965건으로 출력 동일성을 고정한 뒤 Boot 4 와 함께 dev·stg 반영. 서비스 전환 가이드 문서화. 10/27 csms Boot 4.0.8 prod 반영(직전 버그 수정 릴리스를 먼저 내고 stg 확인 뒤 순차 승격), 공통 라이브러리 2.0.0 정식 발행과 1.x 유지 라인(publish/release-1.x) 분리, roaming Boot 4 전환을 release/261028 에 머지해 dev·stg 반영. 10/28 Boot 4.0.8 의 Tomcat 11.0.26 잔여 CVE 4건(2026-65637·65905·65182·68525) 지적을 받아 csms·roaming·partner-roaming 을 4.0.9(Tomcat 11.0.27)로 핫픽스 릴리스(3.5 시절 Tomcat·netty 핀 제거), dev·stg 거쳐 csms prod 승격; 배포 공통 CVE 통과 검증 CI(voltup-workflow)를 과제로 등록.

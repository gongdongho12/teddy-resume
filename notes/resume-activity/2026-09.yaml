  - id: 2026-09-tariff-zone-remap-misapplication
    period: 2026-09-09..2026-09-09
    status: candidate
    delivery: merged
    area: data-integrity
    headline: 프로모션 요금 오적용 원인 규명 — 코드 무결함 입증 후 마스터 데이터 편성 문제로 확정, 오적용 전수 정량화
    impact: 요금 오적용 신고를 요금제 매칭 로직 결함으로 단정하지 않고 로그·감사기록·prod DB 대조로 구역 편성 마스터 데이터가 원인임을 확정. 대상 기간 전수를 오적용/정당으로 분리해 220건·893,812원으로 정량화하고, 동일 패턴 후보 16건을 도출. 구역 재편성이 요금 대상 집합을 무경고로 바꾸는 구조적 공백까지 정리.
    metrics:
      - 오적용 220건 / 전체 프로모션 적용 422건 (52%)
    evidence:
      prs: []
      commits: []

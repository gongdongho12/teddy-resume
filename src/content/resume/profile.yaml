      - title:
          ko: 유저 사이드 백엔드
          en: Customer-Facing Backend and Kakao T Integration
        portfolioSlug: kakao-t-integration
        portfolioAnchor: user-side-backend-overview
        period:
          ko: 2025.07 ~ 현재
          en: Jul 2025 — Present
        summary:
          ko: |
            카카오T 계정/결제 연동(4개 MSA 관통), PnC(Plug & Charge) 자동충전, 미결제 감시와 외부 연동 장애 격리 등 사용자 경험의 핵심이 되는 백엔드 전반을 개발했습니다.
          en: |
            Built customer-facing backend services spanning four microservices, including Kakao T account and payment integration, Plug & Charge enrollment, failed-payment monitoring, and isolation of external-system failures.
        tech:
          - Kotlin
          - Spring Boot
          - GCP Pub/Sub
          - Flyway
        highlights:
          ko:
            - 카카오T 계정/결제 연동을 4개 MSA(auth→user→billing→feapp)에 걸쳐 설계 및 구현 — OAuth2 기반 계정 연동, 결제수단 등록(5단계), 결제 승인/부분 취소까지 전체 플로우 담당
            - 제휴사 고객 토큰을 외부 결제수단과 내부 사용자 컨텍스트를 잇는 기준 키로 정리하고, 검색 인덱스·해지 검증·앱 콜백 전용 activate API 보강
            - 차량 등록 서비스 및 PnC(Plug & Charge) 충전기-차량 고유 키 자동 매핑·인증 시스템 개발
            - 홈페이지 통계 API — 전월 누적합·전일 누적 delta·당일 실시간 합산을 하나의 누적 지표로 결합하고, 공개 트래픽을 고려해 Local/RemoteCache와 분산 락으로 원본 부하 최소화
            - 외부 인증서·U+ 멤버십·블루멤버스 포인트 연동에 전용 풀, 타임아웃, 서킷 브레이커/CallGuard를 적용해 지연 전파와 스레드 고갈을 격리하고 승인·포인트 결과가 불확실할 때 명시적으로 실패하도록 설계
            - 945만 행 규모의 충전 이력 및 어드민 주문 목록에서 발생하던 무필터 COUNT 슬로우 쿼리(1.4~1.6s)를 로컬(1분) + Redis(10분) 2단 캐시로 완충해 DB 풀스캔 부하 해소
            - 타인 인증수단 삭제 IDOR 취약점 식별 즉시 소유권 검증 가드를 적용해 당일 배포하고, 6개월 노출 구간 로그 전수 검사를 통해 오사용 0건 확인
          en:
            - Designed Kakao T account and payment integration across auth, user, billing, and customer-app services, covering OAuth2 linking, five-step card registration, payment approval, and partial cancellation
            - Established the partner customer token as the link between external payment methods and internal user context, adding search indexes, unlink validation, and a callback-specific activation API
            - Built vehicle enrollment and Plug & Charge credential-registration services
            - Combined historical totals and same-day real-time data in one homepage statistics API, using local and remote caches plus distributed locks to protect source systems from public traffic
            - Isolated external certificate, LG U+ Membership, and Bluemembers integrations with dedicated thread pools, timeouts, circuit breakers, and CallGuard so uncertain outcomes fail explicitly instead of exhausting request threads
            - Mitigated 1.4–1.6s full-table scan slow queries on a 9.45M-row charging history table by implementing a two-tier cache (1-min local memory + 10-min Redis)
            - Remediated an IDOR vulnerability in payment-method deletion with same-day backend ownership validation and deployed to production, verifying zero malicious exploitation across 6 months of historical logs
        results:
          ko:
            - 카카오T 제휴사 연동 인프라 및 핵심 비즈니스 로직 성공적 구축 — 결제수단 등록/결제/취소/프로모션 전체 사이클 구현
          en:
            - Delivered the end-to-end Kakao T integration—card registration, payments, cancellations, and promotions—across four microservices


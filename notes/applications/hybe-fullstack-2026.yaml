job_description: |
  하이브의 다양한 데이터(차트·스트리밍·경영·재무)를 의사결정 시스템으로 만드는 조직.
  프론트·백엔드·데이터 구분 없이 한 사람이 요구사항 정의부터 배포·운영까지 서비스 오너로 책임.
  주요 업무: 사내 웹 프론트(그리드/차트·다국어)·백엔드(API·배치·데이터 모델), 외부 데이터 수집기
  (인증·세션, 재시도·백오프, 정합성 검증, 대규모 백필), BigQuery 모델링, 권한·SSO·사내 시스템 연동,
  GCP/AWS·CI/CD, 모델 운영(회귀 검증·속도·비용·품질), Apache Superset 커스터마이징.
  필수: 5년+, 프론트·백엔드 모두 개발·운영, Python 또는 Java/Spring, React/Next.js, SQL·DW,
  GCP/AWS 배포·운영, 현업과 범위 정의, Git 협업·코드 리뷰.
  우대: MCP·에이전트 프레임워크, LLM 제품 기능 구현(품질·비용·지연 관리), 대규모 데이터 수집,
  시큐어코딩, 음악·엔터 데이터 관심.

responses:
  - id: "q1"
    question: "지원한 동기는 무엇이며, 입사 후 본인이 기여할 수 있는 부분은 무엇인지 서술해 주세요."
    max_length: 1000
    final: |
      공고에서 "흩어진 데이터를 의사결정에 쓰이는 시스템으로 만든다"는 문장을 읽고, 카카오스타일에서 가격 데이터를 다루던 때가 떠올랐습니다. 외부 쇼핑몰 가격을 모아 자사 상품과 같은 상품끼리 묶고, 가격이 앞서는지 뒤지는지를 점수로 만들어 가격 조정과 리포트에 쓰는 일이었습니다. 수집 단계에서는 크롤링 차단을 피하려고 모바일 IP 대역 프록시를 직접 구축했고, 매칭 단계에서는 Athena로 이미지 유사도 99.5% 이상인 상품을 골라냈습니다. 네이버 쇼핑 연동은 전체 상품을 매번 다시 읽느라 약 6시간이 걸렸는데, 바뀐 상품만 이벤트로 받아 반영하도록 바꿔 1시간 안으로 줄였습니다. 데이터가 제때, 정확하게 도착해야 판단도 가능하다는 것을 그때 몸으로 배웠습니다.

      볼트업에서는 결제·충전 서비스를 설계부터 운영까지 맡으며, 문제가 앱이든 백엔드든 인프라든 직접 들어가 해결해 왔습니다. 한 사람이 서비스를 끝까지 책임지는 하이브의 방식은 제가 이미 일하고 있는 방식이라 지원했습니다.

      입사하면 먼저 수집기와 배치를 '실패해도 바로 알 수 있고, 복구할 수 있는' 구조로 만드는 데 기여하고 싶습니다. 볼트업에서는 두 달 동안 전부 실패하고 있던 공공 충전이력 수집 배치를 복구하고, 다시는 조용히 실패하지 않도록 모니터링을 붙였습니다. 결제에서도 DLQ와 재시도 배치로 결과가 불확실한 건을 끝까지 추적할 수 있게 했습니다. 이 경험은 차트·스트리밍 수집과 대규모 백필에 그대로 이어질 수 있습니다. 또 사내 에이전트 플랫폼을 만들며 평가 케이스로 답변 품질을 지키면서 토큰 비용을 46% 줄였던 것처럼, 모델을 바꿀 때마다 품질·비용·속도를 지표로 확인하며 운영하겠습니다.

  - id: "q2"
    question: "지원 분야와 관련된 개인의 전문성을 제고하기 위해 꾸준히 노력했던 경험에 대해 서술해 주세요."
    max_length: 1000
    final: |
      새로 익힌 기술은 실제 업무에서 효과를 숫자로 확인할 때까지 놓지 않으려고 합니다. 최근 2년 동안 그렇게 끝까지 가져간 주제는 세 가지입니다.

      첫 번째는 AI를 개발 도구로 쓰는 일입니다. 사내 에이전트 플랫폼 Voltbot을 만들 때는 "좋아진 것 같다"는 느낌 대신 기준을 두려고, 9개 평가 케이스를 3번씩 돌리는 하네스부터 만들었습니다. 정규식으로 도구 호출을 파싱하던 루프를 Gemini 네이티브 function calling으로 바꾼 뒤 하네스로 비교해, 답변 품질은 통계적으로 같게 유지하면서 근거 정합성을 87.7%에서 100%로 높이고 토큰 비용 46%, 실행 시간 10%를 줄였습니다.

      두 번째는 OpenTelemetry 기반 분산 추적입니다. 충전 1건이 여러 서비스를 지나며 추적 ID가 끊기던 문제를, Pub/Sub 메시지에 추적 정보를 실어 보내는 기능을 공통 라이브러리에 넣고 실제 충전 4건을 끝까지 따라가며 메웠습니다. 서비스 간 추적 키 전파율이 0%에서 전 구간 연결로 바뀌었고, 2차 작업 중에는 운영 로그의 회원 ID 기록 비율이 217/300에서 0/300으로 떨어진 회귀를 찾아 근본 원인까지 고쳤습니다.

      세 번째는 로그 비용입니다. 로그 진입점에서 페이로드 크기 상한을 두고 중복 필드를 걷어 내 Cloud Logging 적재량을 하루 120GB에서 18GB로 85% 줄였고, 월 약 1,400달러 절감을 실측으로 확인했습니다.

      또 하나 꾸준히 지켜 온 것은 혼자 알고 끝내지 않고 팀이 쓸 수 있게 공유하는 일입니다. 충전 플랫폼을 넘겨받은 뒤로 문서 38편과 증상별 런북 12종을 직접 써서 팀에 남겼고, 맡던 서비스를 넘겨줄 때도 서비스별 정본 문서를 남겼습니다. 사내 에이전트를 만든 뒤에는 운영팀이 직접 쓸 수 있도록 가이드와 권한 신청 방법을 공유했고, 사내 우수 사례 갤러리에도 5건을 올렸습니다. 회사 밖에서는 2022년부터 부스트캠프·커널360 멘토와 MSA 모니터링 세션 발표로 같은 일을 이어 오고 있습니다.

  - id: "q3"
    question: "본인의 업무상 강점과 보완점을 서술해 주세요."
    max_length: 1000
    final: |
      제 강점은 고객이 쓰는 기능을 화면부터 인프라까지 직접 만들어 왔기 때문에, 문제를 백엔드 한 곳이 아니라 고객이 막히는 전체 흐름에서 보고 고칠 수 있다는 점입니다. 볼트업에서는 Flutter 앱의 QR 스캔·푸시 알림, 카카오T 계정·결제 연동, 결제 백엔드, 충전 주문 경로까지 직접 만들어 운영에 반영해 왔습니다. 그래서 고객에게 "충전 시작 실패" 알림이 잘못 간다는 문제를 맡았을 때도, 서버 오류 하나를 고치기보다 고객이 앱에서 충전을 시작하고 알림을 받기까지의 흐름을 처음부터 따라갔습니다. 서버 로그에는 원격 시작 응답이 늦은 건이 하루 5,861건 쌓여 있었지만, 충전기 원시 로그와 맞춰 보니 대부분은 응답만 늦었을 뿐 충전은 정상적으로 시작되고 있었습니다. 고객은 충전이 잘 되고 있는데 실패 알림을 받고 있었던 것입니다. CSMS와 앱 서버 사이에서 무엇을 실패로 볼지 기준을 다시 정해, 잘못 가던 알림 2종을 없앴습니다.

      또 하나는 위험한 변경을 나눠서, 되돌릴 수 있게 진행하는 것입니다. 충전기 약 1만 대가 서버 배포 때마다 한꺼번에 재접속하면서 DB 요청량이 5.8배로 뛰던 문제를 맡았을 때, 먼저 재접속을 분산하는 수정을 운영에 넣어 다음 배포에서 신규 오류 0건을 확인했습니다. 근본 해결책인 Go 게이트웨이는 그와 별개로, 단계별 투입 계획과 문제가 생기면 기존 서버로 자동으로 돌아가는 경로부터 설계했습니다.

      보완점은 분석용 데이터 웨어하우스 모델링 경험이 깊지 않다는 점입니다. Athena로 매칭 데이터셋을 만들고 사내 에이전트가 BigQuery로 운영 데이터를 조회하도록 연결해 봤지만, 전사 데이터 모델을 처음부터 설계한 경험은 없습니다. 입사 후에는 기존 데이터 모델과 스키마를 먼저 읽고 문서로 정리하며 설계 의도를 익히고, 파티셔닝·클러스터링에 따른 비용과 성능 차이를 실제 쿼리로 재 보면서 판단 기준을 빠르게 갖추겠습니다.

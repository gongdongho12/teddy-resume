  - id: 2026-09-authmethod-delete-idor
    period: 2026-09-08..2026-09-08
    status: candidate
    delivery: merged
    area: security
    headline: 인증수단 삭제 IDOR 취약점 대응 — 소유권 가드 + 개인정보 삭제 userId 스코프, 6개월 노출 구간 전수 검사
    impact: 타인 인증수단 삭제와 소셜 연동 해제까지 가능했던 권한 검증 누락을 백엔드 2개 서비스에서 차단하고, 노출 기간 전체를 전수 검사해 실제 오사용 0건을 확인한 뒤 당일 prod 배포까지 완료. 취약점 발견→가드→영향 전수 확인→배포를 하루 안에 끝낸 고위험 보안 대응.

projectSections:
  - heading:
      ko: 볼트업 프로젝트
      en: VoltUp Projects
    period:
      ko: 2024.09 ~ 현재
      en: Sep 2024 — Present
    projects:
      - title:
          ko: 멀티 벤더 결제 시스템 및 미수 복구 안정화
          en: Multi-Provider Payments and Failed-Payment Recovery
        portfolioSlug: multi-pg-payment
        period:
          ko: 2024.10 ~ 현재
          en: Oct 2024 — Present
        summary:
          ko: |
            결제 서비스를 초기 설계부터 주도하여 단일 결제에서 멀티 벤더사를 수용하는 모듈로 확장하고,
            DB 기반 승인권과 다층 복구 시스템을 구축하여 중복 청구를 방지하고 실패·미수 결제를 추적 가능한 상태로 복구했습니다.
          en: |
            Led the payment service from initial architecture through production delivery, evolving a single-provider flow into a modular multi-provider platform.
            Added database-backed approval ownership and layered recovery to prevent duplicate charges and move failed or unpaid transactions into traceable, recoverable states.
        tech:
          - Kotlin
          - Spring Boot
          - Spring Batch
          - GCP Pub/Sub
          - Cloud SQL
        highlights:
          ko:
            - 결제 서비스를 프로젝트 초기 설계부터 구현까지 전담하며 핵심 개발자로 주도
            - 추상 클래스 기반 벤더 전략 패턴을 설계하여 카카오페이·토스페이먼츠·카카오T를 수용하는 멀티 벤더 결제 아키텍처 구축
            - GCP Pub/Sub DLQ, 영구 미수 처리, 재시도·보완 배치를 연결한 다단계 복구 흐름으로 실패 이벤트 격리와 미수 처리 누락 방지
            - PG 승인 직전 결제 상태를 `AUTHORIZED`로 조건부 전이하는 DB 승인권을 설계해 Redis 락 만료·응답 유실·벤더 변경 상황에서도 재승인을 fail-closed로 차단; 동일 주문 8스레드 경합에서 1건만 선점하는 MySQL 동시성 테스트로 검증
            - 결제 확정 트랜잭션과 미수 부기를 분리해 부기 락 경합이 승인 성공을 롤백해 이중 청구로 이어지는 경로를 차단하고, 미수 재결제의 포인트 이중 차감·설정 소급 문제를 함께 교정
            - READY 고아 주문 상태 동기화·이벤트 자동 재발행과 AUTHORIZED 체류 해소 배치·수동 복구 API를 구성해 결과 미확정 건을 자동 복구 또는 운영 판단 가능한 상태로 전환
          en:
            - Led the payment service from initial design through implementation as a core engineer
            - Designed a provider strategy layer that integrates Kakao Pay, Toss Payments, and Kakao T, a South Korean ride-hailing and mobility platform, behind a common interface
            - Combined Pub/Sub dead-letter queues, retries, and recovery batches into a layered flow that isolates failures and prevents unpaid transactions from being missed
            - Added database-backed approval ownership before payment-gateway calls, preventing duplicate approvals after lock expiry, lost responses, or provider changes; an eight-thread MySQL concurrency test confirmed a single winner per order
            - Separated payment confirmation from unpaid-balance bookkeeping so ledger-lock contention cannot roll back successful approvals or trigger duplicate charges; also corrected double point deductions and retroactive configuration changes during retries
            - Added recovery for orphaned READY orders and long-running AUTHORIZED states through event republishing, scheduled reconciliation, and operator repair APIs

      - title:
          ko: 통합 프로모션(쿠폰/포인트) 플랫폼 구축 및 고도화
          en: Coupon and Points Promotion Platform
        portfolioSlug: promotion-platform
        period:
          ko: "쿠폰: 2025.07 / 포인트: 2025.08 ~ 현재"
          en: "Coupon: Jul 2025 / Points: Aug 2025 — Present"
        summary:
          ko: |
            다양한 제휴사(넥센, 도요타, 블루멤버스)의 프로모션 요구사항을 수용하는 범용 쿠폰·포인트 백엔드 시스템을 구축하고, 쿠폰팩별 결제수단 제한 정책까지 발급/조회/사용/관리 화면 전 구간에 반영했습니다.
          en: |
            Built reusable coupon and points services for partner campaigns including Nexen, Toyota, and Bluemembers.
            Applied coupon-level payment-method restrictions consistently across issuance, lookup, redemption, and operations-console workflows.
        tech:
          - Kotlin
          - Spring Boot
          - MySQL

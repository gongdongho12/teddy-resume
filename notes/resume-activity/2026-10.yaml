  - id: 2026-10-fota-staged-rollout
    period: 2026-10-01..2026-10-08
    status: candidate
    delivery: in_progress
    area: csms
    headline: 충전기 펌웨어(FOTA) 단계적 배포 — 지역·비율 단계 확대와 건강 판정 기반 자동 전이
    impact: 전 대수 일괄 배포였던 펌웨어 업데이트를 시·도 단위 국소전개 후 비율을 단계적으로 늘리고, 단계별 실패 지표가 일정 기간 이상 없으면 다음 단계로 자동 전이하는 구조로 설계·구현. 공통 계약(common)·오케스트레이터와 Flyway(feapp)·연결 이벤트 발행(csms)·지역 필터(charger-service)·어드민 화면까지 5개 저장소에 걸쳐 작업했고, 진행 중 롤아웃이 참조하는 펌웨어 삭제 차단과 기존 실패 판정 오염 결함도 함께 수정. 10/6 여러 모델 펌웨어 쌍 동시 지정·시도 지도 진행 현황·롤백 진행률·단독 충전존 마지막 단계 배정까지 확장. 10/7~8 쌍별 펌웨어 종류·같은 충전기 순차 업데이트(V51)와 상태 이벤트 동기 ack/nack + 1분 주기 상태 보정 루프(이벤트 유실·역전 자동 복구, #1104) 추가. dev·stg 반영, 리뷰 단계(Jakarta 스프린트 PR).

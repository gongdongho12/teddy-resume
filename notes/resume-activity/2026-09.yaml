entries:
  - id: 2026-09-auth-kms-jwt-signing
    period: 2026-08-28..2026-09-10
    status: candidate
    delivery: in_progress
    area: auth
    headline: JWT 서명키를 Cloud KMS 전용으로 전환 — 어드민/유저 신뢰 도메인(JWKS) 분리, 무중단 2단계 컷오버 설계
    impact: 서명 개인키가 서버·Vault 밖으로 나오지 않는 구조로 전환한 보안 아키텍처 작업. legacy 토큰 롤링 재서명으로 무중단 전환, aud 검사 관측→차단 단계 게이트 설계. prod 1단계 9/7·2단계 컷오버 9/8 완료(재서명 정상, 세션 조회 실패 0건). 컷오버 직후 소비자 서명키 참조 누락 1건을 forward fix 로 39분 내 복구하고, pin 대상을 런북이 아니라 코드(서명키 선택 로직·ServiceCode enum)에서 도출하도록 절차를 개정. 9/10 legacy 키 제거·aud 차단 잔여. 9/15 후속으로 KMS 서명 gRPC 가 CANCELLED 로 끝날 때 재시도 없이 500 이 나던 경로를 재시도·타임아웃 60s→5s·호출 계측으로 보강(PR #142, 리뷰 대기).
    metrics: []

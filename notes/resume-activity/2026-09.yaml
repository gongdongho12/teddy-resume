  - id: 2026-09-b2b-approval-login-gate
    period: 2026-09-15..2026-09-16
    status: candidate
    delivery: in_progress
    area: auth
    headline: 제휴사(B2B) 계정 승인 기반 로그인 게이트 — 가입 심사 도메인 신설, 승인 전 로그인 차단을 4개 서비스에 걸쳐 설계·구현
    impact: 제휴사 포털 계정이 가입 즉시 로그인되던 구조를 어드민 승인 후에만 로그인되는 구조로 바꾸는 작업. user-service 에 심사 도메인(user_approval)과 상태 전이·승인 게이트를 신설하고, auth 는 승인 대기·반려를 '인증 실패'로 뭉개지 않고 별도 에러 코드로 전파하도록 분기, feapp 어드민 API 와 admin-fe 심사 화면까지 한 흐름으로 구성. 승인 서비스 장애 시 fail-open 으로 기존 고객 로그인을 보호하는 정책을 확정. 9/16 에 전용 테이블(user_approval) 신설안이 운영 DDL 의존으로 dev/stg 를 멈추게 한 점을 확인하고, 기존 이용정지(user_blocked) 도메인에 승인대기 유형을 더해 스키마 변경 없이 같은 정책을 구현하는 구조로 전면 재설계 — 차단 해제가 곧 승인이 되어 도메인이 하나로 합쳐졌고, 차단 사유 문구를 그대로 사용자에게 전달하는 경로까지 정리. 어드민 심사 화면도 같은 기반으로 재구현했고 dev/stg 반영 완료.
